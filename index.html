<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>疼痛評估系統互動模擬｜謝靜伊（中山醫學大學附設醫院 人工智慧中心）</title>
<meta name="author" content="謝靜伊｜中山醫學大學附設醫院 人工智慧中心 資訊護理師">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F4F7F9;--surface:#FFFFFF;--surface-2:#EDF2F6;--ink:#17283A;--ink-2:#465A6D;--ink-3:#6E8297;--line:#D5DFE8;
  --navy:#123554;--teal:#0B8A84;--teal-2:#08706B;--on-teal:#fff;--teal-soft:#D6EFED;--hi:#F2B705;--hi-soft:#FFF3C9;--ok:#2E8B57;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--mono:"JetBrains Mono",Consolas,ui-monospace,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0D1620;--surface:#132130;--surface-2:#1A2B3D;--ink:#E4ECF4;--ink-2:#A9BACB;--ink-3:#7F93A8;--line:#26394D;--navy:#E4ECF4;--teal:#3CC2B9;--teal-2:#5DD3CB;--on-teal:#03201E;--teal-soft:#123A3A;--hi-soft:#3A3212;--ok:#5FD08F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1620;--surface:#132130;--surface-2:#1A2B3D;--ink:#E4ECF4;--ink-2:#A9BACB;--ink-3:#7F93A8;--line:#26394D;--navy:#E4ECF4;--teal:#3CC2B9;--teal-2:#5DD3CB;--on-teal:#03201E;--teal-soft:#123A3A;--hi-soft:#3A3212;--ok:#5FD08F;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html.big{font-size:118.75%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.7}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;padding:clamp(22px,4vw,44px) clamp(14px,2.5vw,32px) 48px}
.head{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:end;justify-content:space-between;margin-bottom:18px}
.head p{margin:0;color:var(--ink-2);font-size:.92rem}
h1{margin:4px 0 0;font-size:clamp(1.6rem,3vw,2.3rem);line-height:1.25;color:var(--navy);font-weight:900}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:700;font-size:.92rem;line-height:1.2;border-radius:8px;padding:9px 16px;border:1.5px solid var(--teal);background:var(--teal);color:var(--on-teal);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--teal-2);border-color:var(--teal-2)}
.btn.ghost{background:transparent;color:var(--teal)}
.btn.ghost:hover{background:var(--teal-soft)}
.btn.arm{background:#C2433F;border-color:#C2433F;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(11,138,132,.5)}70%{box-shadow:0 0 0 10px rgba(11,138,132,0)}100%{box-shadow:0 0 0 0 rgba(11,138,132,0)}}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}}
/* rail */
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:calc(100dvh - 24px);overflow:auto}
@media (max-width:1000px){.rail{position:static;max-height:none;display:flex;gap:12px;overflow-x:auto}}
.phase{margin-bottom:10px}
.phase h4{margin:0 0 4px;font-size:.78rem;color:var(--ink-3);font-weight:900;letter-spacing:.02em;white-space:nowrap}
.phase ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
@media (max-width:1000px){.phase{margin:0;min-width:200px}}
.phase button{width:100%;font:inherit;text-align:left;display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:center;border:0;background:transparent;color:var(--ink-2);padding:5px 6px;border-radius:7px;cursor:pointer;font-size:.86rem;line-height:1.35}
.phase button:hover{background:var(--surface-2)}
.phase button i{font-style:normal;width:22px;height:22px;border-radius:50%;border:2px solid var(--hi);display:grid;place-items:center;font-size:.72rem;font-weight:900;color:var(--ink)}
.phase button.done i{background:var(--hi);border-color:var(--hi);color:#1d1d1d}
.phase button.on{background:var(--hi-soft);color:var(--ink);font-weight:700}
/* screen */
.scr-scroll{overflow-x:auto;border-radius:12px;box-shadow:0 24px 48px -30px rgba(18,53,84,.6)}
.scrwrap{position:relative;min-width:900px}
#scr{position:relative;height:600px;border-radius:12px;overflow:hidden;font:13px/1.45 "Segoe UI",system-ui,"Noto Sans TC",sans-serif;background:#fff;color:#11181C;user-select:none}
#scr input,#scr textarea,#scr select{font:inherit}
.hlbox{position:absolute;border:3px solid #F2B705;border-radius:9px;pointer-events:none;z-index:30;box-shadow:0 0 0 3px rgba(242,183,5,.25),0 0 16px rgba(242,183,5,.55);transition:left .3s,top .3s,width .3s,height .3s;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(242,183,5,.18),0 0 24px rgba(242,183,5,.75)}}
.hlbox b{position:absolute;top:-3px;width:30px;height:30px;border-radius:50%;background:#F2B705;color:#1d1d1d;display:grid;place-items:center;font:900 15px/1 var(--font);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.hlbox.sl b{left:-40px}.hlbox.sr b{right:-40px}.hlbox.st b{left:-3px;top:-38px}
.hlbox.nudge{animation:nudge .45s}
@keyframes nudge{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.flyer{position:absolute;left:0;top:0;z-index:40;pointer-events:none;padding:4px 11px;border-radius:999px;background:#249361;color:#fff;font:700 12.5px/1.2 var(--font);white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.busy-ov{position:absolute;inset:0;background:rgba(255,255,255,.75);display:grid;place-items:center;z-index:25;font:700 15px var(--font);color:#11181C}
.busy-ov span::before{content:"";display:inline-block;width:16px;height:16px;border:3px solid #C1C8CD;border-top-color:#249361;border-radius:50%;margin-right:10px;vertical-align:-3px;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
/* panel */
.panel{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 20px}
@media (max-width:760px){.panel{grid-template-columns:minmax(0,1fr)}}
.panel h2{margin:0;font-size:1.2rem;line-height:1.4}
.panel h2 small{display:block;font-size:.8rem;color:var(--ink-3);font-weight:700}
.panel .pg{font-size:.8rem;font-weight:700;color:var(--ink-3);white-space:nowrap;align-self:start}
.tasks{grid-column:1/-1;list-style:none;margin:0;padding:0;display:grid;gap:5px}
.tasks li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:6px 10px;border-radius:8px;font-size:.98rem}
.tasks li i{font-style:normal;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--hi);display:grid;place-items:center;font-weight:900;font-size:.82rem}
.tasks li.done{color:var(--ink-3)}
.tasks li.done i{background:var(--hi);color:#1d1d1d}
.tasks li.now{background:var(--hi-soft);font-weight:700}
.tip{grid-column:1/-1;margin:0;padding:10px 14px;border-left:4px solid var(--teal);background:var(--surface-2);border-radius:0 8px 8px 0;font-size:.93rem}
.tip.win{border-left-color:var(--ok)}
.nav{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nav .sp{flex:1}
.nav .hint{font-size:.85rem;color:var(--ink-3)}
.rs-toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--surface);padding:10px 18px;border-radius:10px;font-weight:700;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.fs{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:50}
footer{margin-top:28px;color:var(--ink-3);font-size:.85rem}

:where(#scr) svg{width:16px;height:16px;flex:none}
.sp-top svg{vertical-align:-3px}
/* ===== VS Code skin ===== */
.vs{display:grid;grid-template-rows:34px minmax(0,1fr) 22px;height:100%;background:#1F1F1F;color:#CCCCCC}
.vs-title{display:flex;align-items:center;gap:12px;padding:0 10px;background:#181818;border-bottom:1px solid #2B2B2B;font-size:12px;color:#9D9D9D}
.vs-cmd{margin:0 auto;width:36%;background:#2A2A2A;border:1px solid #3C3C3C;border-radius:6px;text-align:center;padding:2px 0}
.vs-body{display:grid;grid-template-columns:44px 230px minmax(0,1fr);min-height:0}
.vs-body.noside{grid-template-columns:44px minmax(0,1fr)}
.vs-act{background:#181818;border-right:1px solid #2B2B2B;display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:12px;color:#858585}
.vs-act svg{width:22px;height:22px}
.vs-act svg:first-child{color:#D7D7D7}
.vs-side{background:#181818;border-right:1px solid #2B2B2B;padding:8px 0;font-size:12.5px;overflow:hidden}
.vs-side h6{margin:2px 14px 8px;font-size:11px;letter-spacing:.06em;color:#BBBBBB;font-weight:600}
.vs-sec{padding:2px 12px;color:#BBBBBB;font-size:11.5px;font-weight:600}
.vs-folder{display:flex;align-items:center;justify-content:space-between;padding:3px 8px 3px 12px;font-weight:700;font-size:11.5px;color:#CCCCCC;margin-top:4px}
.vs-folder .acts{display:flex;gap:2px}
.vs-ic{width:24px;height:24px;display:grid;place-items:center;border-radius:4px;color:#CCCCCC}
.vs-ic svg{width:16px;height:16px}
.vs-file{padding:3px 10px 3px 28px;display:flex;gap:7px;align-items:center;color:#CCCCCC}
.vs-file .fi{font:700 10.5px/1 var(--mono);min-width:22px}
.vs-editor{display:flex;flex-direction:column;min-width:0;background:#1F1F1F;position:relative}
.vs-tabs{display:flex;height:35px;background:#181818;border-bottom:1px solid #2B2B2B;flex:none}
.vs-tab{display:flex;align-items:center;gap:7px;padding:0 14px;border-right:1px solid #2B2B2B;color:#9D9D9D;font-size:12.5px}
.vs-tab.on{background:#1F1F1F;color:#FFFFFF;box-shadow:inset 0 1px 0 #0078D4}
.vs-content{flex:1;min-height:0;overflow:hidden;position:relative}
.vs-code{padding:8px 0;font:12.5px/1.65 Consolas,var(--mono);white-space:pre}
.vs-ln{display:grid;grid-template-columns:48px 1fr}
.vs-ln>i{font-style:normal;color:#6E7681;text-align:right;padding-right:16px}
.vs-ln.cur{background:#2A2D2E}
.k{color:#569CD6}.s{color:#CE9178}.v{color:#9CDCFE}.fn{color:#DCDCAA}.c{color:#6A9955}.ph{color:#F2B705;background:rgba(242,183,5,.12);border:1px dashed #F2B705;padding:0 4px;border-radius:3px}
.vs-panel{height:46%;border-top:1px solid #2B2B2B;background:#181818;display:flex;flex-direction:column;flex:none}
.vs-ptabs{display:flex;gap:20px;padding:6px 16px;font-size:11.5px;color:#9D9D9D}
.vs-ptabs .on{color:#E7E7E7;border-bottom:1px solid #E7E7E7;padding-bottom:2px}
.vs-term{flex:1;padding:4px 16px;font:12.5px/1.7 Consolas,var(--mono);color:#CCCCCC;white-space:pre-wrap;overflow:hidden}
.vs-term .pl{display:block;padding:1px 4px;border-radius:3px}
.vs-term .ok{color:#89D185}
.vs-term .cur::after{content:"▍";animation:blink 1s steps(1) infinite;color:#CCCCCC}
@keyframes blink{50%{opacity:0}}
.vs-status{background:#181818;border-top:1px solid #2B2B2B;display:flex;align-items:center;gap:14px;padding:0 10px;font-size:11.5px;color:#9D9D9D}
.vs-empty{height:100%;display:grid;place-items:center;position:relative}
.vs-wm{position:absolute;width:220px;height:220px;opacity:.07;color:#fff}
.vs-keys{position:relative;display:flex;align-items:center;gap:6px;color:#CCCCCC;font-size:13px;padding:10px 14px;border-radius:8px;background:#252526;border:1px solid #3C3C3C}
.vs-keys kbd,.kc{font:600 12px/1 var(--mono);background:#3C3C3C;color:#E7E7E7;border-radius:4px;padding:4px 7px;border-bottom:2px solid #555}
.vs-keys span{margin-left:8px;color:#9D9D9D}
.vs-pal{position:absolute;top:40px;left:50%;transform:translateX(-50%);width:560px;background:#252526;border:1px solid #454545;border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.55);padding:6px;z-index:5;color:#CCCCCC}
.vs-caret{display:inline-block;width:1px;height:15px;background:#E7E7E7;vertical-align:-2px;margin-left:1px;animation:blink 1s steps(1) infinite}
.vs-pin{border:1px solid #0078D4;border-radius:4px;padding:4px 8px;margin-bottom:4px;color:#E7E7E7}
.vs-pi{padding:5px 10px;border-radius:4px;display:flex;justify-content:space-between}
.vs-pi b{color:#2AAAFF}
.vs-pi.sel{background:#04395E;color:#fff}
.vs-pi small{color:#9D9D9D}
.vs-welcome{padding:40px 50px;color:#CCCCCC}
.vs-welcome h3{margin:0;font-size:30px;font-weight:300;color:#E7E7E7}
.vs-welcome p{margin:2px 0 26px;color:#9D9D9D;font-size:16px}
.vs-welcome h5{margin:0 0 8px;font-size:15px;font-weight:400;color:#E7E7E7}
.vs-welcome a{display:block;color:#4DAAFC;margin-bottom:6px}
.vs-btn{display:inline-flex;align-items:center;gap:8px;background:#0078D4;color:#fff;border-radius:4px;padding:6px 14px;font-weight:600;margin:18px 0 0 18px}
.save-hint{position:absolute;right:16px;bottom:14px;display:flex;align-items:center;gap:6px;background:#252526;border:1px solid #3C3C3C;border-radius:8px;padding:8px 12px;color:#E7E7E7;font-size:12.5px}
/* desktop */
.desk{display:grid;grid-template-columns:minmax(0,1fr) 230px;height:100%}
.desk-r{background:linear-gradient(160deg,#0F3B57,#145A72);position:relative;display:grid;place-items:center;align-content:center;gap:20px;color:#fff;font-size:12.5px}
.fold{display:grid;justify-items:center;gap:4px;padding:10px 12px;border-radius:6px}
.fold svg{width:64px;height:54px}
.fold span{background:rgba(0,0,0,.25);padding:1px 8px;border-radius:3px}
.desk-note{background:#C0392B;color:#fff;padding:8px 12px;font-weight:700;line-height:1.5;font-size:13px;max-width:190px}

/* ===== Supabase skin ===== */
.sp{display:grid;grid-template-rows:46px minmax(0,1fr);height:100%;background:#fff;color:#11181C}
.sp-top{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #E6E8EB;white-space:nowrap;font-size:13.5px}
.sp-top .bolt{width:20px;height:20px;color:#3ECF8E}
.sp-top .sep{color:#C1C8CD}
.sp-top .bdg{font-size:10px;font-weight:600;border:1px solid #D7DBDF;border-radius:999px;padding:1px 7px;color:#687076}
.sp-top .prod{font-size:10px;font-weight:700;border:1px solid #F5C77E;background:#FFF4E5;color:#C27803;border-radius:999px;padding:1px 8px}
.sp-top .conn{background:#249361;color:#fff;border-radius:8px;padding:4px 12px;font-weight:600}
.sp-top .rt{margin-left:auto;display:flex;gap:12px;color:#687076}
.sp-body{display:grid;grid-template-columns:186px minmax(0,1fr);min-height:0}
.sp-nav{border-right:1px solid #E6E8EB;padding:8px 6px;background:#FCFCFD;overflow:hidden}
.sp-nav a{display:flex;align-items:center;gap:9px;padding:5px 9px;border-radius:6px;color:#3D4449;font-size:13px;cursor:default}
.sp-nav a svg{width:16px;height:16px;flex:none;color:#687076}
.sp-nav a.on{background:#EEF0F2;color:#11181C;font-weight:600}
.sp.compact .sp-body{grid-template-columns:48px minmax(0,1fr)!important}
.sp.compact .sp-nav a{justify-content:center;padding:6px 0}
.sp.compact .sp-nav a span{display:none}
.sp-nav hr{border:0;border-top:1px solid #E6E8EB;margin:5px 4px}
.sp-main{min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.sp-split{display:grid;grid-template-columns:200px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%;min-height:0}
.sp-sub{border-right:1px solid #E6E8EB;padding:14px 10px;overflow:hidden;background:#fff}
.sp-sub h5{margin:0 6px 12px;font-size:15px;font-weight:600}
.sp-sub small{display:block;margin:12px 8px 4px;font-size:10.5px;color:#889096;letter-spacing:.06em;font-weight:600}
.sp-sub a{display:block;padding:4px 8px;border-radius:6px;color:#3D4449;font-size:13px}
.sp-sub a.on{background:#EEF0F2;color:#11181C;font-weight:600}
.sp-box{border:1px solid #D7DBDF;border-radius:8px;padding:6px 10px;color:#687076;font-size:13px;background:#fff;margin:0 4px 8px}
.sp-page{padding:20px 26px;overflow:hidden}
.sp-page h3{margin:0 0 4px;font-size:20px;font-weight:600}
.sp-page .sub{margin:0 0 16px;color:#687076}
.sp-card{border:1px solid #E6E8EB;border-radius:8px;overflow:hidden;background:#fff}
.sp-row{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px;padding:12px 16px;border-top:1px solid #E6E8EB;align-items:center}
.sp-row:first-child{border-top:0}
.sp-in{border:1px solid #D7DBDF;border-radius:6px;padding:6px 10px;background:#F8F9FA;min-height:32px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sp-in .ph{all:unset;color:#B0B7BC}
.sp-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #D7DBDF;border-radius:6px;padding:4px 10px;background:#fff;font-weight:500;white-space:nowrap}
.sp-btn.g{background:#249361;border-color:#249361;color:#fff;font-weight:600}
.sp-btn.gl{background:#6CDDA5;border-color:#6CDDA5;color:#11181C;font-weight:600}
.sp-btn.dis{opacity:.45}
.sp-link{color:#11181C;text-decoration:underline}
.strength{height:4px;border-radius:2px;background:#E6E8EB;margin-top:6px;overflow:hidden}
.strength i{display:block;height:100%;width:0;background:#249361;transition:width .5s}
.sp-sql{display:grid;grid-template-rows:38px 40px minmax(0,1fr) 130px;height:100%;min-height:0}
.sp-sqltabs{display:flex;border-bottom:1px solid #E6E8EB;background:#F8F9FA}
.sp-sqltabs span{display:flex;align-items:center;gap:6px;padding:0 16px;border-right:1px solid #E6E8EB;font-size:12.5px;color:#687076}
.sp-sqltabs span.on{background:#fff;color:#11181C;box-shadow:inset 0 2px 0 #11181C}
.sp-sqltool{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:0 12px;border-bottom:1px solid #E6E8EB;color:#687076;font-size:12.5px}
.sp-ed{overflow:hidden;padding:8px 0;font:12px/1.62 var(--mono);background:#fff;white-space:pre}
.sp-ed .ln{display:grid;grid-template-columns:40px 1fr}
.sp-ed .ln i{font-style:normal;color:#B0B7BC;text-align:right;padding-right:12px}
.sp-ed .kw{color:#2563EB}.sp-ed .cm{color:#889096}.sp-ed .st{color:#B45309}
.sp-ed .empty{color:#B0B7BC;padding:18px 24px;white-space:normal;font-family:var(--font);font-size:13.5px}
.sp-res{border-top:1px solid #E6E8EB;display:flex;flex-direction:column}
.sp-res .rt{display:flex;gap:16px;padding:6px 14px;font-size:12.5px;color:#687076;border-bottom:1px solid #E6E8EB}
.sp-res .rt b{color:#11181C;border-bottom:2px solid #11181C;font-weight:500}
.sp-res .rb{padding:10px 14px;font:12.5px/1.6 var(--mono);color:#11181C;flex:1}
.sp-res table{border-collapse:collapse;font-size:12.5px}
.sp-res td,.sp-res th{border:1px solid #E6E8EB;padding:4px 10px;text-align:left}
.sp-te{display:grid;grid-template-columns:220px minmax(0,1fr);height:100%;min-height:0}

/* D16 */{ph:'E',t:'開啟 GitHub Pages，網站上線',pg:'p.43',tip:'GitHub Pages 會把倉庫裡的 index.html 變成一個公開網址。部署通常要等一兩分鐘。',
 render:u=>gh(u.set?`<div class="gh-set"><nav><a>⚙ General</a><small style="display:block;color:#7D8590;margin:10px 10px 4px;font-size:11.5px">Code and automation</small><a>Branches</a><a>Actions</a><a>Webhooks</a><a>Environments</a><a class="${u.pages?'on':''}" data-k="pages">▣ Pages</a></nav>
  ${u.pages?`<div><h3 style="margin:0 0 10px;font-size:20px">GitHub Pages</h3>${S.pages?`<div class="gh-live"><span><b>Your site is live at <span class="gh-link">${SITE}</span></b><br><small style="color:#7D8590">Last deployed by ${GH_USER} just now</small></span><span class="gh-btn gr" data-k="visit">↗ Visit site</span></div>`:u.deploying?'<div class="gh-live">⏳ Deploying… 通常要等一兩分鐘</div>':'<div class="gh-card" style="color:#7D8590">GitHub Pages is designed to host your pages from a GitHub repository.</div>'}
   <h4 style="margin:18px 0 6px">Build and deployment</h4><p style="margin:0 0 6px;color:#7D8590">Source</p><span class="gh-btn gr">Deploy from a branch ⌄</span><p style="margin:14px 0 6px"><b>Branch</b></p><div style="display:flex;gap:8px" data-k="branch"><span class="gh-btn gr">⑂ ${u.br?'main':'None'} ⌄</span><span class="gh-btn gr">📁 / (root) ⌄</span><span class="gh-btn ${u.br?'':'gr'}" data-k="psave">Save</span></div></div>`:'<div style="color:#7D8590">選左邊的 Pages</div>'}</div>`:`<div class="gh-card"><b>PAIN_NRS</b><div class="gh-files">${['index.html','style.css','app.js','01-setup.sql'].map(f=>`<div><span>📄 ${f}</span><span style="color:#7D8590">Add files via upload</span></div>`).join('')}</div></div>`,ghRepoTabs(u.set?'Settings':'Code')),
 tasks:[{k:'ghset',t:'① 點上方「Settings」',fx:u=>{u.set=true;}},{k:'pages',t:'② 左側點「Pages」',fx:u=>{u.pages=true;}},{k:'branch',t:'③ Branch 選 main、/(root)',fx:u=>{u.br=true;}},{k:'psave',t:'④ 按「Save」，等部署完成',anim:async u=>{u.deploying=true;draw();await sleep(RM?100:1600);},fx:()=>{S.pages=true;}},{k:'visit',t:'⑤ 出現「Your site is live at …」，按 Visit site',fx:()=>{}}]},
/* D17 */{ph:'E',t:'做成 QR Code，分享給別人',pg:'p.44',tip:'網址框可以換成你自己的 GitHub Pages 網址，右邊會產生 QR Code，別人用手機一掃就能打開你的系統。',
 render:u=>`<div class="qrs"><div class="qrs-top"><b>QR碼產生器</b><span>我的QR碼</span><span>掃描QR碼</span><span>QR碼簡介</span><span>操作說明</span><span style="margin-left:auto">qr.ioi.tw/zh</span></div><div class="qrs-body"><div class="qrs-p"><h5>QR碼內容輸入</h5><div class="pb"><b>選擇 QR Code 類別</b><span style="border:1px solid #CCC;border-radius:6px;padding:4px 8px">網址 ⌄</span><b>網址</b><div data-k="qurl"><textarea id="qrUrl" ${S.qr?'':'readonly'} aria-label="網址">${S.qr?esc(u.url||SITE):''}</textarea></div><small style="color:#6A7">可以改成你自己的網址</small></div></div>
  <div class="qrbox" data-k="qrimg"><div id="qrOut">${S.qr?'':'<span class="qph">貼上網址後，這裡會出現 QR Code</span>'}</div></div><div class="qrs-p"><h5>QR碼設定</h5><div class="pb"><span>QR碼尺寸：400px</span><span>容錯率：H - 高(30%)</span><span>邊框：1</span></div></div></div></div>`,
 after:u=>{if(S.qr)drawQR(u.url||SITE);const ta=$('#qrUrl');if(ta&&S.qr){ta.addEventListener('input',()=>{u.url=ta.value;drawQR(ta.value);});}},
 tasks:[{k:'qurl',t:'① 把剛剛的網站網址貼上',fx:()=>{S.qr=true;}},{k:'qrimg',t:'② 出現 QR Code：用手機掃描，打開你的系統',fx:()=>{}}]},
/* F1 */{ph:'F',t:'開新對話，先貼 Prompt 00 開場約定',pg:'Prompt 00',tip:'每次開新對話，都先貼第 0 段：說好全程繁中、每次給完整檔案、只用基本技術、只用假資料。之後全程用同一個對話視窗，AI 才記得前面的需求。',
 render:u=>cgUI(u,cgChat(u)),
 tasks:[{k:'newchat',t:'在 ChatGPT 左上方按「新對話」',fx:u=>{S.chat=[];u.note='<b>一個系統，一個對話。</b>從頭到尾都用這個對話視窗。';}},...promptTasks('p00','f')]},
/* F2 */{ph:'F',t:'Prompt 01、02：說目的，回答七個問題',pg:'Prompt 01–02',tip:'第一句話說「目的」，不是說技術。接著回答七個問題，請 AI 整理成規格書。看完一定要確認：AI 有沒有誤會你的意思？不對就直接告訴它哪裡要改。',
 render:u=>cgUI(u,cgChat(u)),
 tasks:[...promptTasks('p01','f'),...promptTasks('p02','f'),{k:'spec',t:'看 AI 整理的規格書，確認內容正確',fx:u=>{u.note='<b>這就是一份簡易需求規格書。</b>看 AI 有沒有誤會：使用者、要記錄的資料、要不要登入。不對就直接回「第 3 點要改成…」。';}}]},
/* F3 */{ph:'F',t:'Prompt 03：先讓 AI 規劃，不寫程式',pg:'Prompt 03',tip:'不要一開始就叫 AI 寫程式。先請它規劃頁面、按鈕、要保存的資料，你看得懂、確認了，再進下一步。',
 render:u=>cgUI(u,cgChat(u)),
 tasks:[...promptTasks('p03','f'),{k:'plan',t:'看「需要保存的資料」：這就是之後的兩張資料表',fx:u=>{u.note='<b>profiles 和 pain_records</b>，就是之後在 Supabase 會看到的兩張資料表。';}}]},
/* F4 */{ph:'F',t:'Prompt 04：先做出看得到的畫面',pg:'Prompt 04',tip:'第一版先不接資料庫，只要「看得到、點得動」。AI 會告訴你檔案怎麼命名、放在哪裡、怎麼打開測試，照著做就好。',
 render:u=>cgUI(u,cgChat(u)),
 tasks:[...promptTasks('p04','f'),{k:'howto',t:'看最下面：檔案怎麼命名、放哪裡、怎麼打開',fx:u=>{u.note='<b>照著做就好。</b>這就是 Prompt 04 第 4 點要 AI 給的說明。';}}]},
/* F5 */{ph:'F',t:'看不懂？請 AI 用白話解釋',pg:'使用方式 04',tip:'AI 說的話看不懂，不用自己查，直接回：「請用白話解釋給完全不懂程式的人聽」。你負責描述需求和驗收，看不懂就問。',
 render:u=>cgUI(u,cgChat(u)),
 tasks:[...promptTasks('pq','f')]},
/* F6 */{ph:'F',t:'Prompt 05：接上資料庫，AI 給三樣東西',pg:'Prompt 05',tip:'第 4 段做完，要先到 VS Code 建檔、測試畫面，沒問題才回來貼第 5 段。AI 會給三樣東西：修改後的完整檔案、SQL、設定教學。',
 render:u=>cgUI(u,cgChat(u)),
 tasks:[...promptTasks('p05','f'),
  {k:'t-js',t:'第 1 樣：修改後的完整檔案（app.js 多了 Supabase 連線設定）',fx:u=>{u.note='<b>修改後的完整檔案</b>：在 VS Code 把舊內容全部刪掉，整個貼上新的。';}},
  {k:'t-sql',t:'第 2 樣：完整 SQL（標籤是 SQL）',fx:u=>{u.note='<b>SQL 不放進 VS Code 執行。</b>它要貼到 Supabase 的 SQL Editor 執行。';}},
  {k:'b5-steps',t:'第 3 樣：一步一步的設定教學',fx:u=>{u.note='<b>照著設定教學一步一步做</b>，就是 B～E 段的內容。';}}]}

];
const PH={A:'A｜ChatGPT：產生程式、看懂標題',B:'B｜VS Code：複製貼上',C:'C｜Supabase 設定',D:'D｜啟動測試',E:'E｜上線分享',F:'F｜Prompt 教學：一段一段帶 AI 做'};

/* ---------- engine ---------- */
let cur=0,ti=0,ui={},busy=false;const doneSteps=new Set(pref.get('bfs-done',[]));
function fastForward(n){S=fresh();for(let i=0;i<n;i++){const u={};STEPS[i].tasks.forEach(t=>t.fx(u));}}
function go(n){cur=Math.max(0,Math.min(STEPS.length-1,n));fastForward(cur);ui={};ti=0;draw();$('#scrwrap').scrollIntoView&&0;}
function draw(){const st=STEPS[cur];$('#scr').innerHTML=st.render(ui);if(st.after)st.after(ui);scrollChat();placeBox();renderPanel();renderRail();}
function scrollChat(){const ch=$('.chat',$('#scr'));if(!ch)return;ch.scrollTop=ch.scrollHeight;const st0=STEPS[cur];const t=target()||(st0.focusDone&&ti>=st0.tasks.length?$(`[data-k="${st0.focusDone}"]`,$('#scr')):null);const ib=t&&t.closest('.cg-blk-b');if(ib){const a=ib.getBoundingClientRect(),b=t.getBoundingClientRect();ib.scrollTop+=(b.top-a.top)-a.height/2;}if(t&&ch.contains(t)){const cr=ch.getBoundingClientRect(),tr=t.getBoundingClientRect();ch.scrollTop+=(tr.top-cr.top)-44;}ch.addEventListener('scroll',()=>requestAnimationFrame(placeBox),{passive:true});$$('.cg-blk-b',ch).forEach(b=>b.addEventListener('scroll',()=>requestAnimationFrame(placeBox),{passive:true}));}
function target(){const t=STEPS[cur].tasks[ti];return t?$(`[data-k="${t.k}"]`,$('#scr')):null;}
function placeBox(){const hl=$('#hl'),el=target();if(!el||busy){hl.hidden=true;return;}const w=$('#scrwrap').getBoundingClientRect(),r=el.getBoundingClientRect(),p=4;let L=r.left,T=r.top,R=r.right,B=r.bottom;const clips=[$('#scr').getBoundingClientRect()];const ch=el.closest('.chat');if(ch)clips.push(ch.getBoundingClientRect());const ib=el.closest('.cg-blk-b');if(ib)clips.push(ib.getBoundingClientRect());clips.forEach(c=>{L=Math.max(L,c.left);T=Math.max(T,c.top);R=Math.min(R,c.right);B=Math.min(B,c.bottom);});
  if(R-L<6||B-T<6){hl.hidden=true;return;}hl.hidden=false;const sr=$('#scr').getBoundingClientRect();hl.classList.remove('sl','sr','st');hl.classList.add(L-sr.left>44?'sl':(sr.right-R>44?'sr':'st'));hl.style.left=(L-w.left-p)+'px';hl.style.top=(T-w.top-p)+'px';hl.style.width=(R-L+p*2)+'px';hl.style.height=(B-T+p*2)+'px';$('#hln').textContent=ti+1;}
async function doTask(){const st=STEPS[cur],t=st.tasks[ti];if(!t||busy)return;busy=true;$('#hl').hidden=true;
  try{if(t.anim)await t.anim(ui);t.fx(ui);ti++;}finally{busy=false;}
  if(ti>=st.tasks.length){doneSteps.add(cur);pref.set('bfs-done',[...doneSteps]);}draw();}
function renderPanel(){const st=STEPS[cur],all=ti>=st.tasks.length;const pn=$('#pNote');pn.hidden=!ui.note;pn.innerHTML=ui.note||'';const px=$('#pExtra');px.hidden=!st.panel;px.innerHTML=st.panel?st.panel(ui):'';
  $('#pTitle').innerHTML=`<small>${PH[st.ph]}　步驟 ${cur+1} / ${STEPS.length}</small>${esc(st.t)}`;$('#pPage').textContent=/^p\./.test(st.pg)?'對照簡報 '+st.pg:st.pg;
  $('#pTasks').innerHTML=st.tasks.map((t,i)=>`<li class="${i<ti?'done':i===ti?'now':''}"><i>${i<ti?'✓':i+1}</i><span>${esc(t.t.replace(/^[①②③④⑤⑥⑦⑧⑨⑩]+\s*/,''))}</span></li>`).join('');
  const tip=$('#pTip');tip.classList.toggle('win',all);tip.textContent=all?(cur===STEPS.length-1?'完成！從一個空資料夾，到有資料庫、有權限、可以分享的疼痛評估系統。這就是「想 → 寫 → 問 → 做 → 測 → 改」裡的「做」。':'✓ 這一步完成。'+st.tip):st.tip;
  $('#bPrev').disabled=cur===0;$('#bNext').disabled=cur===STEPS.length-1;$('#bNext').classList.toggle('pulse',all&&cur<STEPS.length-1);$('#bAuto').disabled=all;
  $('#bHint').textContent=all?'':'點黃色框框，或按「自動示範」';}
function renderRail(){$('#rail').innerHTML=Object.entries(PH).map(([k,label])=>`<div class="phase"><h4>${label}</h4><ol>${STEPS.map((s,i)=>s.ph===k?`<li><button type="button" data-i="${i}" class="${i===cur?'on':''} ${doneSteps.has(i)?'done':''}"><i>${doneSteps.has(i)?'✓':i+1}</i><span>${esc(s.t)}</span></button></li>`:'').join('')}</ol></div>`).join('');}
$('#rail').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b&&!busy)go(+b.dataset.i);});
$('#scr').addEventListener('click',e=>{if(busy)return;const el=target();if(!el)return;const hb=$('#hl');let inBox=false;if(!hb.hidden){const r=hb.getBoundingClientRect();inBox=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;}if(el.contains(e.target)||inBox){e.preventDefault();const t=STEPS[cur].tasks[ti];if(t&&t.check&&!t.check(e,ui)){draw();return;}doTask();}else{const hl=$('#hl');hl.classList.remove('nudge');void hl.offsetWidth;hl.classList.add('nudge');}});
$('#bPrev').addEventListener('click',()=>{if(!busy)go(cur-1);});
$('#bNext').addEventListener('click',()=>{if(!busy)go(cur+1);});
$('#bRedo').addEventListener('click',()=>{if(!busy)go(cur);});
$('#bAuto').addEventListener('click',async()=>{const b=$('#bAuto');b.disabled=true;while(ti<STEPS[cur].tasks.length){await sleep(RM?80:650);if(busy)break;await doTask();}});
window.addEventListener('resize',()=>requestAnimationFrame(placeBox));

/* ---------- helpers ---------- */
async function typeIn(k,text,speed,input){const host=$(`[data-k="${k}"]`,$('#scr'));if(!host)return;const el=$('.typing',host)||$(`[data-k="${k}"] ~ * .typing`,$('#scr'))||(host.closest('.box')&&$('.typing',host.closest('.box')));if(!el)return;
  if(RM){el.textContent=text;return;}for(let i=1;i<=text.length;i++){el.textContent=text.slice(0,i);await sleep(speed||55);}await sleep(250);}
async function busyOv(msg,ms){const d=document.createElement('div');d.className='busy-ov';d.innerHTML=`<span>${esc(msg)}</span>`;$('#scr').appendChild(d);await sleep(RM?80:ms);d.remove();}
function fly(from,to,label,color){return new Promise(res=>{if(!from||!to){res();return;}const stage=$('#scrwrap');const f=document.createElement('div');f.className='flyer';f.textContent=label;if(color)f.style.background=color;stage.appendChild(f);
  const s=stage.getBoundingClientRect(),a=from.getBoundingClientRect(),b=to.getBoundingClientRect(),w=f.offsetWidth,h=f.offsetHeight;
  const A=`translate(${a.left-s.left+a.width/2-w/2}px,${a.top-s.top+a.height/2-h/2}px)`,B=`translate(${b.left-s.left+b.width/2-w/2}px,${b.top-s.top+b.height/2-h/2}px)`;
  if(!f.animate||RM){f.remove();res();return;}const an=f.animate([{transform:A,opacity:0},{transform:A,opacity:1,offset:.1},{transform:B,opacity:1,offset:.9},{transform:B,opacity:0}],{duration:1000,easing:'cubic-bezier(.5,0,.3,1)'});an.onfinish=()=>{f.remove();res();};});}
function drawQR(url){const out=$('#qrOut');if(!out)return;out.innerHTML='';if(!url.trim()){out.innerHTML='<span class="qph">請輸入網址</span>';return;}
  if(window.QRCode){try{new window.QRCode(out,{text:url.trim(),width:230,height:230,correctLevel:window.QRCode.CorrectLevel.H});return;}catch(e){}}
  out.innerHTML='<span class="qph">QR Code 元件沒有載入，請到 qr.ioi.tw/zh 產生</span>';}
/* typing fallback for case code box */
STEPS.find(s=>s.t.startsWith('送出一筆評估')).tasks[1].anim=async()=>{const el=$('.box .typing',$('#scr'));if(!el)return;if(RM){el.textContent='123456';return;}for(let i=1;i<=6;i++){el.textContent='123456'.slice(0,i);await sleep(70);}await sleep(250);};

const rb=$('#resetAll');let rbT=null;
rb.addEventListener('click',()=>{if(busy)return;if(!rb.classList.contains('arm')){rb.classList.add('arm');rb.textContent='再按一次：清除進度，回到第 1 步';clearTimeout(rbT);rbT=setTimeout(()=>{rb.classList.remove('arm');rb.textContent='從頭開始';},4000);return;}
  clearTimeout(rbT);rb.classList.remove('arm');rb.textContent='從頭開始';try{localStorage.removeItem('bfs-done');}catch(e){}doneSteps.clear();go(0);window.scrollTo({top:0,behavior:RM?'auto':'smooth'});toastMsg('已清除進度，從第 1 步重新開始');});
function toastMsg(t){const d=document.createElement('div');d.className='rs-toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}
go(0);
})();
</script>
